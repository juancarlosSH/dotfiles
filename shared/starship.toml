"$schema" = 'https://starship.rs/config-schema.json'

# Prompt minimal: sin bloques/pastillas powerline (agnoster), solo texto e
# iconos de color sobre el fondo de la terminal. Dos lineas: info arriba,
# el simbolo de entrada abajo.
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$dotnet\
$java\
$c\
${custom.typescript}\
${custom.react}\
${custom.vue}\
${custom.express}\
${custom.fastapi}\
${custom.docker}\
${custom.dotenv}\
$fill\
${custom.spotify}\
$time\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[fill]
symbol = " "

[directory]
style = "fg:blue bold"
format = "[󰉋 $path]($style) "
truncation_length = 5
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:mauve"
format = '[$symbol $branch]($style) '

# $all_status = conflicted + stashed + deleted + renamed + modified + staged
# + untracked (orden fijo de Starship). $ahead_behind = commits arriba/abajo
# del remoto. "up_to_date" es explicito (icono, no vacio) para que se note
# cuando la rama esta sincronizada.
[git_status]
style = "fg:red"
format = '[$all_status$ahead_behind]($style) '
conflicted = "=${count} "
stashed = "📦${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = "✓ "

# --- Lenguajes (icono + version, sin fondo) -----------------------------
[nodejs]
symbol = ""
style = "fg:green"
format = '[$symbol $version]($style) '

[python]
symbol = ""
style = "fg:yellow"
format = '[$symbol $version]($style) '

[rust]
symbol = ""
style = "fg:peach"
format = '[$symbol $version]($style) '

[golang]
symbol = ""
style = "fg:sky"
format = '[$symbol $version]($style) '

[dotnet]
symbol = "󰪮"
style = "fg:mauve"
format = '[$symbol $version]($style) '

[java]
style = "fg:maroon"
format = '[$symbol $version]($style) '

[c]
style = "fg:blue"
format = '[$symbol $version]($style) '
detect_extensions = ["c", "h", "cpp", "hpp", "cc", "cxx"]

# --- Frameworks (icono + texto de color, solo aparecen si se detectan) --
# TypeScript: presencia de tsconfig.json (sin costo de shell)
[custom.typescript]
detect_files = ["tsconfig.json"]
style = "fg:lavender"
format = "[󰛦 TS]($style) "

# React / Vue / Express / FastAPI: solo corren dentro de WSL/Linux (os =
# "linux"), asi nunca disparan un spawn de WSL desde Windows nativo (medido:
# ~4s en frio). "detect_files"/"detect_folders" son el gate barato (existencia,
# sin shell); el grep real va DENTRO de "command" (no "when": detect_files+when
# se combinan con OR en Starship, no con AND, asi que "when" quedaria
# ignorado). "detect_folders" cubre monorepos (backend/frontend/etc. con su
# propio package.json): un nombre de carpeta tipico ya destraba el gate, y el
# comando busca el package.json real hasta 2 niveles adentro (find), sin
# node_modules. Si el grep no matchea, "&&" corta la ejecucion, no hay
# output, y el modulo se oculta solo. El grupo [...] debe contener SOLO
# $output, sin texto fijo ni espacios de padding: cualquier caracter literal
# dentro del mismo grupo sobrevive aunque $output este vacio (el texto de
# color queda "flotando" vacio) -- verificado. Por eso el icono Y el padding
# van dentro del echo.
#
# OJO con "find | xargs -r": si find no encuentra nada, xargs -r simplemente
# NO corre grep y sale con exit 0 (exito) -- indistinguible de "grep matcheo".
# Eso rompe el "&&" (falso positivo verificado: FastAPI aparecia sin haber
# ningun requirements.txt/pyproject.toml en el repo). Por eso primero se
# junta la lista de archivos en una variable y se comprueba "[ -n ... ]"
# ANTES de correr grep -- asi "no hay archivos" da exit 1 de verdad.
[custom.react]
os = "linux"
detect_files = ["package.json"]
detect_folders = ["frontend", "client", "web", "app"]
command = 'f=$(find . -maxdepth 2 -not -path "*/node_modules/*" -iname package.json 2>/dev/null); [ -n "$f" ] && printf "%s\n" "$f" | xargs -d "\n" grep -qi "\"react\"" 2>/dev/null && echo "󰜈 React"'
format = "[$output]($style) "
style = "fg:sky"

[custom.vue]
os = "linux"
detect_files = ["package.json"]
detect_folders = ["frontend", "client", "web", "app"]
command = 'f=$(find . -maxdepth 2 -not -path "*/node_modules/*" -iname package.json 2>/dev/null); [ -n "$f" ] && printf "%s\n" "$f" | xargs -d "\n" grep -qi "\"vue\"" 2>/dev/null && echo "󰡄 Vue"'
format = "[$output]($style) "
style = "fg:green"

[custom.express]
os = "linux"
detect_files = ["package.json"]
detect_folders = ["backend", "server", "api"]
command = 'f=$(find . -maxdepth 2 -not -path "*/node_modules/*" -iname package.json 2>/dev/null); [ -n "$f" ] && printf "%s\n" "$f" | xargs -d "\n" grep -qi "\"express\"" 2>/dev/null && echo "󰎙 Express"'
format = "[$output]($style) "
style = "fg:overlay2"

[custom.fastapi]
os = "linux"
detect_files = ["requirements.txt", "pyproject.toml"]
detect_folders = ["backend", "server", "api"]
command = 'f=$(find . -maxdepth 2 -not -path "*/node_modules/*" \( -iname requirements.txt -o -iname pyproject.toml \) 2>/dev/null); [ -n "$f" ] && printf "%s\n" "$f" | xargs -d "\n" grep -qi fastapi 2>/dev/null && echo "󱐋 FastAPI"'
format = "[$output]($style) "
style = "fg:teal"

[custom.docker]
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", ".dockerignore", "compose.yml", "compose.yaml"]
style = "fg:sapphire"
format = "[🐳 Docker]($style) "

# .env presente: aviso claro, color de atencion
[custom.dotenv]
detect_files = [".env"]
style = "fg:red"
format = "[🔐 .env]($style) "

# --- Spotify (solo Windows: lee cache que llena un watcher en background) -
# "when = true" fuerza que el modulo siempre se evalue (no hay archivo que
# detectar). Sin comillas en la ruta: Starship rompe el re-quoting si el
# comando trae comillas dobles (bug verificado). %USERPROFILE% no tiene
# espacios en esta cuenta, asi que funciona sin comillas.
[custom.spotify]
os = "windows"
when = true
shell = ["cmd"]
# chcp 65001 es necesario: cmd.exe usa la codepage heredada (no UTF-8) para
# su salida cuando va por un pipe -- como hace Starship internamente -- en
# vez de a una consola real. Sin esto, emojis/acentos salen corruptos
# (bug real detectado: "ðŸŽµ" en vez de "🎵").
command = 'chcp 65001>nul && type %USERPROFILE%\.cache\spotify_now_playing.txt'
style = "fg:green"
format = "[$output]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:subtext0"
format = "[🕐 $time]($style) "

[cmd_duration]
min_time = 500
style = "fg:peach"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
